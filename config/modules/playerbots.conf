#####################################################################################################################
# START: custom playerbots.conf settings
#####################################################################################################################

#--------------------------------------------------------------------------------------------------------------------
#--------------------------------------------------------------------------------------------------------------------
# general
#--------------------------------------------------------------------------------------------------------------------
#--------------------------------------------------------------------------------------------------------------------

Playerbots.Enabled = 1
Playerbots.DeleteRandomBotAccounts = 0
Playerbots.RandomBotAccountPrefix = "rndbot"
Playerbots.LimitTalentsExpansion = 0
Playerbots.RandomBotJoinBG = 1

# Bot group invitation permission level (0 = GM only, 1 = accept based on level, 2 = always accept)
# Default: 1 (accept based on level)
Playerbots.GroupInvitationPermission = 1

# Disable randombots when no real players are logged in
# Default: 0 (randombots will login when server starts)
# If enabled, randombots will only log in 30 seconds (default) after a real player logs in, and will log out 300 seconds (default) after all real players log out
Playerbots.DisabledWithoutRealPlayer = 0
Playerbots.DisabledWithoutRealPlayerLoginDelay = 30
Playerbots.DisabledWithoutRealPlayerLogoutDelay = 300


#--------------------------------------------------------------------------------------------------------------------
#--------------------------------------------------------------------------------------------------------------------
# randombots 
# - RandomBotMaps: 0=Eastern Kingdoms, 1=Kalimdor, 530=Outland, 571=Northrend
# - RandombotStartingLevel (if 'DisableRandomLevels' disabled): below 5 will 
#   cause lag if not worse, due the design of level 1 areas they will cluster 
#   which is hard for the server to deal with.
#--------------------------------------------------------------------------------------------------------------------
#--------------------------------------------------------------------------------------------------------------------

Playerbots.MinRandomBots = 3000
Playerbots.MaxRandomBots = 3000
Playerbots.RandomBotMinLevel = 1
Playerbots.RandomBotMaxLevel = 80
Playerbots.DisableDeathKnightLogin = 0
Playerbots.RandomBotAllianceRatio = 50
Playerbots.RandomBotHordeRatio = 50

Playerbots.RandomBotAccountCount = 0
#Playerbots.RandomBotAccountCount = 500

Playerbots.RandomBotMaps = 0,1,530,571
Playerbots.AutoTeleportForLevel = 1
Playerbots.RandomBotTeleportDistance = 100
Playerbots.RandomBotTeleLowerLevel = 1
Playerbots.RandomBotTeleHigherLevel = 3
Playerbots.ProbTeleToBankers = 0.25

Playerbots.RandomBotFixedLevel = 0
Playerbots.DisableRandomLevels = 0
Playerbots.SyncLevelWithPlayers = 0

Playerbots.SyncQuestWithPlayer = 1
Playerbots.PreQuests = 0
Playerbots.AutoDoQuests = 1
Playerbots.RandomBotGroupNearby = 0
Playerbots.AutoLearnQuestSpells = 1
Playerbots.EquipAndSpecPersistence = 1
Playerbots.SummonWhenGroup = 0

Playerbots.RandombotStartingLevel = 1
Playerbots.RandomBotMinLevelChance = 0.1
Playerbots.RandomBotMaxLevelChance = 0.1

# Randombots will behave more like real players (experimental)
# This option will override Playerbots.AutoDoQuests, RandomBotTeleLowerLevel, and RandomBotTeleHigherLevel
# Default: 1 (enabled)
Playerbots.EnableNewRpgStrategy = 1

# Control probability weights for RPG status of bots. Takes effect only when the status meets its premise.​
# Sum of weights need not be 100. Set to 0 to disable the status.
#
# WanderRandom  (Default: 15  Move randomly nearby to find and kill mobs)
# WanderNpc     (Default: 20  Randomly interact with nearby NPCs​)
# GoGrind       (Default: 15  Go to nearby level-appropriate locations to grind for killing mobs)
# GoCamp        (Default: 10  Return to a nearby camp depending on innkeeper/flightmaster)​
# DoQuest       (Default: 60  Select quest from the quest log and head to the location to attempt completion​)
# TravelFlight  (Default: 15  Go to the nearest flightmaster and fly to a level-appropriate area)
# Rest          (Default: 5   Take a break for a while and do nothing)
#
#Playerbots.RpgStatusProbWeight.WanderRandom = 10
#Playerbots.RpgStatusProbWeight.WanderNpc = 10
#Playerbots.RpgStatusProbWeight.GoGrind = 50
#Playerbots.RpgStatusProbWeight.GoCamp = 10
#Playerbots.RpgStatusProbWeight.DoQuest = 30
#Playerbots.RpgStatusProbWeight.TravelFlight = 15
#Playerbots.RpgStatusProbWeight.Rest = 5

Playerbots.RpgStatusProbWeight.WanderRandom = 1
Playerbots.RpgStatusProbWeight.WanderNpc = 15
Playerbots.RpgStatusProbWeight.GoGrind = 3
Playerbots.RpgStatusProbWeight.GoCamp = 1
Playerbots.RpgStatusProbWeight.DoQuest = 80
Playerbots.RpgStatusProbWeight.TravelFlight = 0
Playerbots.RpgStatusProbWeight.Rest = 0

# Enable/Disable cheats for bots
# "gold" (bots have infinite gold)
# "health" (bots have infinite health)
# "mana" (bots have infinite mana)
# "power" (bots have infinite energy, rage, and runic power)
# "taxi" (bots may use all flight paths, though they will not actually learn them) 
# "raid" (bots use cheats implemented into raid strategies) 
Playerbots.BotCheats = "taxi,raid" 


#--------------------------------------------------------------------------------------------------------------------
#--------------------------------------------------------------------------------------------------------------------
# command 
#--------------------------------------------------------------------------------------------------------------------
#--------------------------------------------------------------------------------------------------------------------

Playerbots.AutoGearCommand = 1
Playerbots.AutoGearCommandAltBots = 1
Playerbots.MaintenanceCommand = 1

# Equipment quality limitation for autogear command (1 = normal, 2 = uncommon, 3 = rare, 4 = epic, 5 = legendary)
# Default: 3 (rare)
Playerbots.AutoGearQualityLimit = 3

# Equipment item level (not gearscore) limitation for autogear command (0 = no limit)
# Classic
# Max iLVL Tier 1 = 66 | Tier 2 = 76 | Tier 2.5 = 88 | Tier 3 = 92
# Max iLVL Phase 1(MC, Ony, ZG) = 78 | Phase 2(BWL) = 83 | Phase 2.5(AQ40) = 88 | Phase 3(Naxx40) = 92
# TBC
# Max iLVL Tier 4 = 120 | Tier 5 = 133 | Tier 6 = 164
# Max iLVL Phase 1(Kara, Gruul, Mag) = 125 | Phase 1.5(ZA) = 138 | Phase 2(SC, TK) = 141 | Phase 3(Hyjal, BT) = 156 | Phase 4(Sunwell) = 164
# Wotlk
# Max iLVL Tier 7(10/25) = 200/213 | Tier 8(10/25) = 225/232 | Tier 9(10/25) = 232/245 | Tier 10(10/25/HC) = 251/264/290
# Max iLVL Phase 1(Naxx) = 224 | Phase 2(Ulduar) = 245 | Phase 3(ToC) = 258 | Phase 4(ICC) = 290 
# Default: 0 (no limit)
Playerbots.AutoGearScoreLimit = 0

Playerbots.AllowAccountBots = 1
Playerbots.AllowGuildBots = 1

Playerbots.AddClassCommand = 1
Playerbots.MaxAddedBots = 40
Playerbots.AddClassAccountPoolSize = 50


